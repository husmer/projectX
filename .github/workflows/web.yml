name: KotobaGate web

on:
  push:
    paths:
      - 'web/**'
      - 'wordlists/jlpt_n5*'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# Least privilege per job; actions are pinned to commit SHAs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Logic and word-list checks
        working-directory: web
        run: node --test

      - name: Assemble site
        run: |
          mkdir _site
          cp web/index.html web/app.js web/logic.js web/style.css web/icon.png wordlists/jlpt_n5.tsv wordlists/jlpt_n5_sentences.tsv wordlists/THIRD_PARTY_NOTICES.md _site/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  # GitHub Pages only deploys from the default branch unless the github-pages environment allows others.
  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
