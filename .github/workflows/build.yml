name: Build APK

on:
  push:
  workflow_dispatch:

# Actions are pinned to commit SHAs: this workflow holds the signing key and can publish releases.
permissions:
  contents: write # for the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HANZIGATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hanzigate.keystore"
            echo "HANZIGATE_KEYSTORE=$RUNNER_TEMP/hanzigate.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No HANZIGATE_KEYSTORE_BASE64 secret: this build uses a throwaway debug key and is not published as a release."
          fi

      - name: Test and build
        env:
          HANZIGATE_KEYSTORE_PASSWORD: ${{ secrets.HANZIGATE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HanziGate.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HanziGate
          path: HanziGate.apk

      # A "latest" release per branch, so the APK can be downloaded straight to the phone.
      - name: Publish release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: HanziGate (latest from ${{ github.ref_name }})
          body: |
            Built from ${{ github.sha }}.
            On your phone: download HanziGate.apk below and open it to install.
          prerelease: true
          make_latest: false
          files: HanziGate.apk
