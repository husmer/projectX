name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HanziGate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HanziGate
          path: HanziGate.apk

      # A "latest" release per branch, so the APK can be downloaded straight to the phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: HanziGate (latest from ${{ github.ref_name }})
          body: |
            Built from ${{ github.sha }}.
            On your phone: download HanziGate.apk below and open it to install.
          prerelease: true
          make_latest: false
          files: HanziGate.apk
