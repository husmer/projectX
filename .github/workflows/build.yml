name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HANZIGATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hanzigate.keystore"
            echo "HANZIGATE_KEYSTORE=$RUNNER_TEMP/hanzigate.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No HANZIGATE_KEYSTORE_BASE64 secret: this build uses a throwaway debug key and is not published as a release."
          fi

      - name: Test and build
        env:
          HANZIGATE_KEYSTORE_PASSWORD: ${{ secrets.HANZIGATE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HanziGate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HanziGate
          path: HanziGate.apk

      # A "latest" release per branch, so the APK can be downloaded straight to the phone.
      - name: Publish release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: HanziGate (latest from ${{ github.ref_name }})
          body: |
            Built from ${{ github.sha }}.
            On your phone: download HanziGate.apk below and open it to install.
          prerelease: true
          make_latest: false
          files: HanziGate.apk
